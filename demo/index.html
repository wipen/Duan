<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duan Playground</title>
<style>
  :root {
    --bg: #f5f7fa;
    --panel: #ffffff;
    --border: #e5e9f0;
    --ink: #17233b;
    --ink-soft: #5b6b84;
    --accent: #2563eb;
    --accent-soft: #eff4ff;
    --good: #0f9d6a;
    --warn: #b45309;
    --mono: "SF Mono", ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    background: var(--bg);
    display: flex;
    flex-direction: column;
  }
  /* ---------- header ---------- */
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--border);
    flex: 0 0 auto;
  }
  .brand { display: flex; align-items: baseline; gap: 8px; font-weight: 700; font-size: 18px; }
  .brand .mark { color: var(--accent); font-size: 22px; }
  .brand .sub { font-weight: 500; color: var(--ink-soft); font-size: 14px; }
  .tagline { color: var(--ink-soft); font-size: 13px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .header-controls { display: flex; align-items: center; gap: 10px; }
  .server-box { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-soft); }
  #apiBase {
    width: 170px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px;
    font-size: 12px; color: var(--ink); background: var(--bg);
  }
  .lang-switch { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .lang-switch button {
    border: 0; background: var(--panel); color: var(--ink-soft); padding: 6px 12px; font-size: 13px; cursor: pointer;
  }
  .lang-switch button.active { background: var(--accent); color: #fff; }
  /* ---------- layout ---------- */
  main { flex: 1 1 auto; display: flex; min-height: 0; }
  aside {
    width: 300px; flex: 0 0 auto; overflow-y: auto; padding: 16px;
    background: var(--panel); border-right: 1px solid var(--border);
  }
  aside h2 { margin: 0 0 2px; font-size: 15px; }
  .hint { margin: 0 0 14px; font-size: 12px; color: var(--ink-soft); }
  .ex-card {
    border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px;
    cursor: pointer; background: var(--panel); transition: border-color .12s, box-shadow .12s;
  }
  .ex-card:hover { border-color: var(--accent); }
  .ex-card.active { border-color: var(--accent); background: var(--accent-soft); }
  .ex-card .row { display: flex; align-items: center; gap: 8px; }
  .ex-card .title { font-size: 13.5px; font-weight: 600; flex: 1; }
  .badge { font-size: 10.5px; padding: 2px 7px; border-radius: 20px; border: 1px solid var(--border); color: var(--ink-soft); }
  .badge.lang { background: #eef2ff; border-color: #dbe3ff; }
  .ex-card .gold { font-size: 11.5px; color: var(--ink-soft); margin-top: 4px; }
  .ex-card .gold b { color: var(--accent); }
  /* ---------- playground ---------- */
  section.playground { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; padding: 16px; gap: 12px; overflow-y: auto; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; display: flex; flex-direction: column; min-height: 0; }
  .panel-head { padding: 8px 14px; border-bottom: 1px solid var(--border); font-size: 12px; font-weight: 600; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .03em; }
  textarea {
    border: 0; resize: vertical; min-height: 130px; padding: 12px 14px; font-family: var(--mono);
    font-size: 12.5px; line-height: 1.5; color: var(--ink); background: transparent; outline: none;
  }
  .panel.state textarea { min-height: 150px; }
  .panel.questions textarea { min-height: 170px; }
  .toolbar { display: flex; align-items: center; gap: 10px; }
  button.primary {
    background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 10px 22px;
    font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button.primary:hover { background: #1d4ed8; }
  button.primary:disabled { background: #a5b4fc; cursor: not-allowed; }
  button.ghost {
    background: transparent; color: var(--ink-soft); border: 1px solid var(--border); border-radius: 8px;
    padding: 9px 16px; font-size: 13px; cursor: pointer;
  }
  button.ghost:hover { border-color: var(--accent); color: var(--accent); }
  .status { font-size: 12px; color: var(--ink-soft); }
  .status.err { color: #dc2626; }
  /* ---------- result ---------- */
  .result { padding: 16px; }
  .result .decision-line { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .result .decision {
    font-size: 30px; font-weight: 700; color: var(--accent);
    background: var(--accent-soft); border-radius: 8px; padding: 4px 16px;
  }
  .result .meta { color: var(--ink-soft); font-size: 13px; display: flex; gap: 16px; flex-wrap: wrap; }
  .result .meta b { color: var(--ink); }
  .bars { margin-top: 14px; display: flex; flex-direction: column; gap: 7px; }
  .bar-row { display: flex; align-items: center; gap: 10px; font-size: 12.5px; }
  .bar-row .lbl { width: 30px; text-align: right; font-weight: 600; color: var(--ink-soft); flex: 0 0 auto; }
  .bar-track { flex: 1; background: #eef1f6; border-radius: 6px; height: 18px; position: relative; overflow: hidden; }
  .bar-fill { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, var(--accent), #60a5fa); border-radius: 6px; transition: width .3s; }
  .bar-row .pct { width: 92px; text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-soft); flex: 0 0 auto; font-family: var(--mono); font-size: 12px; }
  .reference { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--border); font-size: 12.5px; color: var(--ink-soft); }
  .reference b { color: var(--good); }
  .abstain-tag { font-size: 11px; padding: 2px 8px; border-radius: 20px; background: #fff7ed; color: var(--warn); border: 1px solid #fed7aa; font-weight: 600; }
  .placeholder { color: var(--ink-soft); font-size: 13px; padding: 10px 2px; }
</style>
</head>
<body>
  <header>
    <div class="brand"><span class="mark">◈</span><span data-i18n="title">Duan</span><span class="sub" data-i18n="sub">Playground</span></div>
    <div class="tagline" data-i18n="tagline">System-1 decision engine — emergency &amp; clinical decisions</div>
    <div class="header-controls">
      <div class="server-box">
        <label data-i18n="server">Server</label>
        <input id="apiBase" value="" placeholder="/predict">
      </div>
      <div class="lang-switch">
        <button id="btn-en" class="active">EN</button>
        <button id="btn-zh">中文</button>
      </div>
    </div>
  </header>

  <main>
    <aside>
      <h2 data-i18n="examplesTitle">Example use cases</h2>
      <p class="hint" data-i18n="examplesHint">Real cases from the test split. Click to load.</p>
      <div id="examples"></div>
    </aside>

    <section class="playground">
      <div class="panel state">
        <div class="panel-head" data-i18n="state">State</div>
        <textarea id="stateEditor" spellcheck="false" placeholder='{ "age": 55, "chief_complaint": "..." }'></textarea>
      </div>
      <div class="panel questions">
        <div class="panel-head" data-i18n="questions">Questions</div>
        <textarea id="questionsEditor" spellcheck="false" placeholder='{ "acuity": { "type": "choice", ... } }'></textarea>
      </div>
      <div class="toolbar">
        <button class="primary" id="run" data-i18n="run">Run</button>
        <button class="ghost" id="clear" data-i18n="clear">Clear</button>
        <span class="status" id="status"></span>
      </div>
      <div class="panel result" id="resultPanel" hidden>
        <div class="panel-head" data-i18n="result">Result</div>
        <div id="resultBody" class="result"></div>
      </div>
    </section>
  </main>

const I18N = {
  en: {
    title: "Duan", sub: "Playground",
    tagline: "System-1 decision engine — emergency & clinical decisions",
    examplesTitle: "Example use cases",
    examplesHint: "Real cases from the test split. Click to load.",
    state: "State", questions: "Questions",
    run: "Run", clear: "Clear",
    result: "Result", decision: "Decision", confidence: "Confidence",
    reference: "Reference label (test set)", probability: "Probability",
    server: "Server", noResult: "Run to see the decision.",
    error: "Request failed", errorHint: "Make sure the inference server is running: python serve.py",
    taskChoice: "choice", taskScore: "score", taskNoul: "yes/no",
    answer: "Answer", abstain: "Abstain", tokens: "tokens",
  },
  zh: {
    title: "Duan", sub: "演示",
    tagline: "System-1 决策引擎 — 急诊与临床决策",
    examplesTitle: "示例用例",
    examplesHint: "来自测试集的真实用例，点击加载。",
    state: "患者状态", questions: "问题",
    run: "运行", clear: "清空",
    result: "结果", decision: "决策", confidence: "置信度",
    reference: "参考标签（测试集）", probability: "概率",
    server: "服务地址", noResult: "点击运行查看决策结果。",
    error: "请求失败", errorHint: "请先启动推理服务：python serve.py",
    taskChoice: "单选", taskScore: "评分", taskNoul: "是非",
    answer: "答案", abstain: "弃权", tokens: "tokens",
  }
};

const TASK_BADGE = {
  en: { choice: "choice", score: "score", noul: "yes/no" },
  zh: { choice: "单选", score: "评分", noul: "是非" },
};

let lang = "en";
let current = null;

const $ = (id) => document.getElementById(id);

function t(key) { return I18N[lang][key] || key; }

function setLang(l) {
  lang = l;
  document.querySelectorAll("[data-i18n]").forEach((el) => {
    const k = el.getAttribute("data-i18n");
    if (k === "title") el.textContent = I18N[lang].title;
    else if (k === "sub") el.textContent = I18N[lang].sub;
    else el.textContent = I18N[lang][k] || el.textContent;
  });
  $("btn-en").classList.toggle("active", lang === "en");
  $("btn-zh").classList.toggle("active", lang === "zh");
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  renderExamples();
  if (current) { $("stateEditor").value = pretty(current.state); $("questionsEditor").value = pretty(current.questions); }
  const statusEl = $("status"); if (!statusEl.dataset.err) statusEl.textContent = "";
}

function pretty(v) {
  if (typeof v === "string") return v;
  return JSON.stringify(v, null, 2);
}

function renderExamples() {
  const box = $("examples");
  box.innerHTML = "";
  EXAMPLES.forEach((ex) => {
    const card = document.createElement("div");
    card.className = "ex-card" + (current && current.id === ex.id ? " active" : "");
    const title = lang === "zh" ? ex.title_zh : ex.title_en;
    const badge = TASK_BADGE[lang][ex.task];
    const gold = ex.gold;
    card.innerHTML =
      `<div class="row"><span class="title"></span><span class="badge"></span><span class="badge lang">${ex.lang === "zh" ? "中文" : "EN"}</span></div>` +
      `<div class="gold">${t("answer")}: <b></b></div>`;
    card.querySelector(".title").textContent = title;
    card.querySelector(".badge").textContent = badge;
    card.querySelector(".gold b").textContent = gold;
    card.onclick = () => loadExample(ex);
    box.appendChild(card);
  });
}

function loadExample(ex) {
  current = ex;
  $("stateEditor").value = pretty(ex.state);
  $("questionsEditor").value = pretty(ex.questions);
  $("resultPanel").hidden = true;
  $("status").textContent = "";
  renderExamples();
}

function parseState(text) {
  const s = text.trim();
  try {
    const v = JSON.parse(s);
    if (typeof v === "object" && v !== null) return v;
  } catch (e) { /* not JSON — treat as raw text state */ }
  return text;
}

async function run() {
  const stateText = $("stateEditor").value.trim();
  const questionsText = $("questionsEditor").value.trim();
  const statusEl = $("status");
  statusEl.dataset.err = "";
  statusEl.textContent = "";
  if (!questionsText) { statusEl.textContent = t("noResult"); return; }

  let questions;
  try { questions = JSON.parse(questionsText); }
  catch (e) { statusEl.textContent = "Questions: invalid JSON"; statusEl.dataset.err = "1"; return; }

  const state = stateText ? parseState(stateText) : null;
  const base = ($("apiBase").value || "/predict").replace(/\/+$/, "");
  const url = base.startsWith("http") ? base : base;

  const btn = $("run");
  btn.disabled = true;
  btn.textContent = "…";
  try {
    const resp = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ state, questions }),
    });
    if (!resp.ok) {
      const detail = await resp.text().catch(() => "");
      throw new Error("HTTP " + resp.status + (detail ? " — " + detail : ""));
    }
    const res = await resp.json();
    renderResult(res, state);
    statusEl.textContent = "";
  } catch (err) {
    statusEl.textContent = t("error") + ": " + err.message + " · " + t("errorHint");
    statusEl.dataset.err = "1";
    $("resultPanel").hidden = true;
  } finally {
    btn.disabled = false;
    btn.textContent = t("run");
  }
}

function renderResult(res, state) {
  const answers = res.answers || {};
  const qid = Object.keys(answers)[0];
  if (!qid) { $("resultPanel").hidden = true; return; }
  const ans = answers[qid];
  const body = $("resultBody");
  body.innerHTML = "";

  // decision
  const decisionLine = document.createElement("div");
  decisionLine.className = "decision-line";

  let decisionText, entries = [], isNoul = false;
  if (ans.type === "noul") {
    isNoul = true;
    const pTrue = ans.noul ?? 0.5;
    decisionText = (pTrue >= 0.5 ? "true" : "false") + " (" + (pTrue * 100).toFixed(1) + "%)";
    entries = [["false", 1 - pTrue], ["true", pTrue]];
  } else if (ans.type === "score") {
    decisionText = String(ans.score);
    entries = Object.entries(ans.probabilities || {});
  } else {
    decisionText = String(ans.choice);
    entries = Object.entries(ans.probabilities || {});
  }

  const d = document.createElement("span");
  d.className = "decision";
  d.textContent = decisionText;
  decisionLine.appendChild(d);

  const meta = document.createElement("div");
  meta.className = "meta";
  meta.innerHTML =
    `<span>${t("confidence")}: <b>${(ans.confidence ?? 0).toFixed(4)}</b></span>` +
    (isNoul ? "" : `<span>${t("probability")}: <b>${(ans.answer_confidence ?? 0).toFixed(4)}</b></span>`);
  decisionLine.appendChild(meta);
  body.appendChild(decisionLine);

  // bars
  if (entries.length) {
    entries.sort((a, b) => (a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0));
    const bars = document.createElement("div");
    bars.className = "bars";
    entries.forEach(([label, p]) => {
      const row = document.createElement("div");
      row.className = "bar-row";
      const pct = Math.max(0, Math.min(1, p));
      row.innerHTML =
        `<span class="lbl">${escapeHtml(String(label))}</span>` +
        `<div class="bar-track"><div class="bar-fill" style="width:${(pct * 100).toFixed(1)}%"></div></div>` +
        `<span class="pct">${(pct * 100).toFixed(1)}%</span>`;
      bars.appendChild(row);
    });
    body.appendChild(bars);
  }

  // reference label (if the loaded example matches this result)
  if (current) {
    const ref = document.createElement("div");
    ref.className = "reference";
    ref.innerHTML = t("reference") + ": <b>" + escapeHtml(String(current.gold)) + "</b>";
    body.appendChild(ref);
  }

  $("resultPanel").hidden = false;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

$("btn-en").onclick = () => setLang("en");
$("btn-zh").onclick = () => setLang("zh");
$("run").onclick = run;
$("clear").onclick = () => {
  current = null;
  $("stateEditor").value = "";
  $("questionsEditor").value = "";
  $("resultPanel").hidden = true;
  $("status").textContent = "";
  renderExamples();
};

// init: English, load first example
setLang("en");
if (EXAMPLES.length) loadExample(EXAMPLES[0]);
</script>
